[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expression-tomography"
version = "0.1.0"
description = "Experimental harness for bidirectional expression tomography."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SpiralReality" }]
license = "Apache-2.0"
keywords = [
  "llm-evaluation",
  "expression",
  "semantic-debt",
  "metaphor",
  "research-harness",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.2"]
cue = ["tiktoken==0.12.0"]
hf = ["torch", "transformers"]

[project.scripts]
et-rule-z = "expression_tomography.tasks.rule_z.task:main"
et-rule-z-intermediate-probe = "expression_tomography.tasks.rule_z.intermediate_probe:main"
et-rule-z-intermediate-probe-migrate = "expression_tomography.tasks.rule_z.intermediate_probe_migration:main"
et-rule-z-audit-calibration = "expression_tomography.tasks.rule_z.audit_calibration_task:main"
et-rule-z-audit-calibration-compare = "expression_tomography.tasks.rule_z.audit_calibration_compare:main"
et-rule-z-extraction-intervention = "expression_tomography.tasks.rule_z.extraction_intervention_task:main"
et-rule-z-extraction-intervention-compare = "expression_tomography.tasks.rule_z.extraction_intervention_compare:main"
et-rule-z-extraction-intervention-migrate = "expression_tomography.tasks.rule_z.extraction_intervention_migration:main"
et-rule-z-extraction-intervention-lineage-migrate = "expression_tomography.tasks.rule_z.extraction_intervention_lineage_migration:main"
et-rule-z-null-cue-surface = "expression_tomography.tasks.rule_z.extraction_intervention_null_cue:main"
et-rule-z-rule-revision-leakage = "expression_tomography.tasks.rule_z.rule_revision_leakage_task:main"
et-rule-z-rule-revision-semantic-diagnostics = "expression_tomography.tasks.rule_z.rule_revision_semantic_diagnostics:main"
et-rule-z-revision-interface-cues = "expression_tomography.tasks.rule_z.revision_interface_cues:main"
et-rule-z-revision-interface = "expression_tomography.tasks.rule_z.revision_interface_task:main"
et-rule-z-revision-interface-manifest = "expression_tomography.tasks.rule_z.revision_interface_manifest:main"
et-metaphor-transfer = "expression_tomography.tasks.metaphor_transfer.task:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["expression_tomography*"]
